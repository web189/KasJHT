<body data-theme="dark">

<!-- ============ BOOT LOADER (splash 7 detik) ============ -->
<div id="bootLoader" class="boot-loader">
  <div class="boot-inner">
    <div class="boot-piggy-wrap">
      <span class="boot-coin" style="--d:0;--x:-34px"></span>
      <span class="boot-coin" style="--d:1;--x:-10px"></span>
      <span class="boot-coin" style="--d:2;--x:14px"></span>
      <span class="boot-coin" style="--d:3;--x:36px"></span>
      <span class="boot-coin" style="--d:4;--x:-22px"></span>
      <span class="boot-coin" style="--d:5;--x:2px"></span>
      <span class="boot-coin" style="--d:6;--x:26px"></span>
      <div class="boot-piggy-glow"></div>
      <img src="./assets/piggy.png" class="boot-piggy-img" alt="JHT KAS">
    </div>
    <div class="boot-progress-track"><div class="boot-progress-fill" id="bootProgressFill"></div></div>
    <div class="boot-percent" id="bootPercent">0%</div>
    <div class="boot-phrase-wrap"><div class="boot-phrase" id="bootPhrase">Menginisialisasi sistem…</div></div>
    <div class="boot-footer">Website Developer <a href="https://benyoriki.com/" target="_blank" rel="noopener">benyoriki.com</a></div>
  </div>
</div>

<div id="app"></div>

<!-- ============ GLOBAL GAME MODAL (persist across route renders) ============ -->
