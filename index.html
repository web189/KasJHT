<script>
/* Tangkap event instal SEJAK AWAL (sebelum skrip lain selesai dimuat) — kunci agar tombol Instal berfungsi di Windows 7 */
window.__bip=null;window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();window.__bip=e;});
window.addEventListener('appinstalled',function(){window.__pwaInstalled=true;});
</script>
<script>
/* Terapkan tema TERSINKRON sebelum apapun dirender (anti-FOUC / anti-flash).
   Kalau ini menunggu script.js di bawah body (yang antre di belakang SDK
   Firebase yang berat), sempat ada jeda singkat di mana <html> belum
   punya data-theme sama sekali -> semua var(--bg)/var(--ink) dianggap
   tidak valid -> sebagian elemen tampil pudar/putih tanpa kontras,
   persis gejala "tampilan PC belang" yang dilaporkan. */
(function(){
  try{
    var t = localStorage.getItem('jht_theme');
    if (t !== 'light' && t !== 'dark') {
      /* belum pernah memilih -> ikuti pengaturan perangkat (default gelap bila tak terbaca) */
      t = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    }
    document.documentElement.setAttribute('data-theme', t);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', t === 'light' ? '#f4f0f1' : '#110a0c');
  }catch(e){
    document.documentElement.setAttribute('data-theme','dark');
  }
})();
</script>
<style id="criticalFOUC">
/* CSS KRITIKAL, inline (tidak menunggu style.css eksternal) — supaya di
   koneksi lambat, layar loading TETAP menutup penuh layar & warna dasar
   tema gelap/terang sudah benar sejak cat pertama, bukan putih polos
   tak bertema selama style.css masih diunduh. Ini akar dari 2 gejala yang
   dilaporkan: (1) "loading screen belum selesai tapi website sudah
   tampil" — sebenarnya loading TIDAK transparan, cuma latar globalnya
   masih putih default browser karena style.css belum sempat diterapkan,
   jadi konten mentah di baliknya kelihatan "nembus"; (2) "tema gelap
   tidak kena semua" — elemen yang belum sempat ke-style otomatis
   memakai default putih/hitam browser, bukan variabel tema. style.css
   akan menyempurnakan semuanya begitu selesai dimuat; loading screen 8
   detik memberi banyak waktu untuk itu. */
html[data-theme="dark"]{background:#110a0c;}
html[data-theme="dark"] body{background:#110a0c;color:#F8F0E8;}
html[data-theme="light"]{background:#f4f0f1;}
html[data-theme="light"] body{background:#f4f0f1;color:#2A171C;}
body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}

}
